<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temporarily Unavailable</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 25px;
    }

    .box {
      max-width: 600px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 15px;
      letter-spacing: 1px;
    }

    p {
      color: #aaa;
      font-size: 16px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>Website Temporarily Unavailable</h1>
    <p>
      This website is currently unavailable.
      Please check back soon.
    </p>
  </div>
</body>
</html>
